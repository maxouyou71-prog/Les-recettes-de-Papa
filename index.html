    <style>
        :root { --cream: #fdf6ec; --brown: #5c3d2e; --orange: #e07b39; --light-orange: #f5c18a; }
        body { background: var(--cream); font-family: 'Lato', sans-serif; color: #2a1a0e; margin: 0; }
        header { background: var(--brown); padding: 2rem; text-align: center; color: var(--cream); }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 2.5rem; }
        header p { margin: 0.5rem 0 0; opacity: 0.8; font-size: 0.95rem; }
        main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .search-bar { width: 100%; padding: 1rem; border: 2px solid var(--light-orange); border-radius: 50px; margin-bottom: 2rem; font-size: 1rem; outline: none; box-sizing: border-box; }
        .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; justify-content: center; }
        .cat-btn { background: white; border: 2px solid var(--light-orange); border-radius: 50px; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: 'Lato', sans-serif; }
        .cat-btn.active { background: var(--orange); color: white; border-color: var(--orange); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: white; border-radius: 15px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; border-left: 5px solid var(--orange); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card h3 { margin: 0.5rem 0 0; font-size: 1.05rem; color: var(--brown); }
        .card .tag { font-size: 0.75rem; color: var(--orange); font-weight: bold; text-transform: uppercase; }
        #count { text-align: center; color: var(--brown); margin-bottom: 1rem; font-style: italic; }
    </style>
</head>

const categories = {"01- Apéritifs et liqueurs": "Apéritifs et liqueurs", "02- Amuses-bouches et apéro": "Amuses-bouches et apéro", "03- Sauces": "Sauces", "04- Soupes": "Soupes", "05- Entrées": "Entrées", "06- Oeufs": "Oeufs", "07- Viandes": "Viandes", "08- Poissons": "Poissons", "09- Accompagnements": "Accompagnements", "10- Plats": "Plats", "11- Recettes allègées": "Recettes allègées", "12- Fast-food": "Fast-food", "13- Fromages": "Fromages", "14- Desserts": "Desserts", "15- Crèmes et compotes": "Crèmes et compotes", "16- Garnitures dessert": "Garnitures dessert", "17- Glaces": "Glaces", "18- Pâtes sucrées ou salées": "Pâtes sucrées ou salées", "19- Pains": "Pains", "20-Astuces en cuisine": "Astuces en cuisine"};
let currentCat = 'Toutes';

// Créer les boutons de catégories
const filterContainer = document.getElementById('category-filters');
Object.entries(categories).forEach(([folder, cleanName]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerText = cleanName;
    btn.onclick = () => filterByCat(folder);
    filterContainer.appendChild(btn);
});

function render() {
    const searchTerm = document.getElementById('search').value.toLowerCase();
    const filtered = allRecipes.filter(r => {
        const matchCat = (currentCat === 'Toutes' || r.category === currentCat);
        return matchCat && r.name.toLowerCase().includes(searchTerm);
    });
    document.getElementById('count').textContent = filtered.length + ' recette' + (filtered.length > 1 ? 's' : '');
    document.getElementById('recipe-grid').innerHTML = filtered.map(r => `
        <div class="card" onclick="window.open('${r.url}', '_blank')">
            <div class="tag">${r.displayName}</div>
            <h3>${r.name}</h3>
        </div>
    `).join('');
}

function filterByCat(cat) {
    currentCat = cat;
    document.querySelectorAll('.cat-btn').forEach(btn => {
        const isAll = cat === 'Toutes' && btn.innerText === 'Toutes';
        const matchCat = categories[cat] === btn.innerText;
        btn.classList.toggle('active', isAll || matchCat);
    });
    render();
}

document.getElementById('search').oninput = render;
render();
</script>
