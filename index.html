    * { box-sizing: border-box; margin: 0; padding: 0; }

    header { background: var(--warm-brown); padding: 2.5rem 2rem 2rem; text-align: center; position: relative; overflow: hidden; }

    header p.subtitle { color: var(--light-orange); font-size: 1rem; margin-top: 0.4rem; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; }

    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-bottom: 2rem; }
    .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-wrap input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.8rem; border: 2px solid var(--light-orange); border-radius: 50px; font-family: 'Lato', sans-serif; font-size: 1rem; background: white; color: var(--dark); outline: none; transition: border 0.2s; }
    .search-wrap input:focus { border-color: var(--orange); }
    .search-wrap .icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.1rem; pointer-events: none; }

    .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.8rem; }
    .cat-btn { background: white; border: 2px solid var(--light-orange); border-radius: 50px; padding: 0.4rem 1.1rem; font-family: 'Lato', sans-serif; font-size: 0.9rem; cursor: pointer; color: var(--warm-brown); font-weight: 700; transition: all 0.2s; }
    .cat-btn:hover, .cat-btn.active { background: var(--orange); border-color: var(--orange); color: white; }

    .stats { font-size: 0.9rem; color: var(--gray); margin-bottom: 1.2rem; }
    .stats span { font-weight: 700; color: var(--warm-brown); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }

    .card { background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 1.4rem 1.2rem 1.2rem; cursor: pointer; transition: transform 0.18s, box-shadow 0.18s; border: 1.5px solid rgba(224,123,57,0.13); display: flex; flex-direction: column; gap: 0.6rem; animation: fadeIn 0.4s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(92,61,46,0.18); }
    .card .cat-tag { display: inline-block; background: var(--light-orange); color: var(--warm-brown); border-radius: 50px; padding: 0.18rem 0.8rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; align-self: flex-start; }
    .card h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--warm-brown); line-height: 1.3; }
    .card .pdf-icon { font-size: 1.5rem; opacity: 0.5; align-self: flex-end; margin-top: auto; }

    .empty { text-align: center; padding: 4rem 1rem; color: var(--gray); }
    .empty .big { font-size: 4rem; margin-bottom: 1rem; }
    .empty p { font-size: 1.1rem; line-height: 1.6; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,26,14,0.7); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 20px; width: 100%; max-width: 860px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.5rem; background: var(--warm-brown); color: var(--cream); }
    .modal-header h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; }
    .modal-close { background: none; border: none; color: var(--cream); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 0.2rem 0.5rem; border-radius: 6px; transition: background 0.2s; }
    .modal-close:hover { background: rgba(255,255,255,0.15); }
    .modal-body { flex: 1; overflow: hidden; }
    .modal-body iframe { width: 100%; height: 100%; min-height: 70vh; border: none; }
  </style>
</head>

aper%2520une%2520mayonnaise.pdf&embedded=true"}];
const categories = {"01- Apéritifs et liqueurs": {"name": "Apéritifs et liqueurs", "icon": "🍹"}, "02- Amuses-bouches et apéro": {"name": "Amuses-bouches et apéro", "icon": "🧆"}, "03- Sauces": {"name": "Sauces", "icon": "🫙"}, "04- Soupes": {"name": "Soupes", "icon": "🥣"}, "05- Entrées": {"name": "Entrées", "icon": "🥗"}, "06- Oeufs": {"name": "Oeufs", "icon": "🥚"}, "07- Viandes": {"name": "Viandes", "icon": "🥩"}, "08- Poissons": {"name": "Poissons", "icon": "🐟"}, "09- Accompagnements": {"name": "Accompagnements", "icon": "🥦"}, "10- Plats": {"name": "Plats", "icon": "🍲"}, "11- Recettes allègées": {"name": "Recettes allègées", "icon": "🥑"}, "12- Fast-food": {"name": "Fast-food", "icon": "🍔"}, "13- Fromages": {"name": "Fromages", "icon": "🧀"}, "14- Desserts": {"name": "Desserts", "icon": "🍰"}, "15- Crèmes et compotes": {"name": "Crèmes et compotes", "icon": "🍮"}, "16- Garnitures dessert": {"name": "Garnitures dessert", "icon": "🍓"}, "17- Glaces": {"name": "Glaces", "icon": "🍦"}, "18- Pâtes sucrées ou salées": {"name": "Pâtes sucrées ou salées", "icon": "🥐"}, "19- Pains": {"name": "Pains", "icon": "🍞"}, "20-Astuces en cuisine": {"name": "Astuces en cuisine", "icon": "💡"}};
let currentCat = 'Toutes';

// Boutons catégories
const catContainer = document.getElementById('categories');
const allBtn = document.createElement('button');
allBtn.className = 'cat-btn active';
allBtn.textContent = '🍽️ Toutes';
allBtn.onclick = () => filterByCat('Toutes');
catContainer.appendChild(allBtn);

Object.entries(categories).forEach(([folder, info]) => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = info.icon + ' ' + info.name;
  btn.onclick = () => filterByCat(folder);
  catContainer.appendChild(btn);
});

function render() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  const filtered = allRecipes.filter(r => {
    const matchCat = currentCat === 'Toutes' || r.category === currentCat;
    return matchCat && r.name.toLowerCase().includes(searchTerm);
  });
  const n = filtered.length;
  document.getElementById('stats').innerHTML = `<span>${n}</span> recette${n !== 1 ? 's' : ''} trouvée${n !== 1 ? 's' : ''}`;
  if (n === 0) {
    document.getElementById('grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🍳</div><p>Aucune recette ne correspond.</p></div>`;
    return;
  }
  document.getElementById('grid').innerHTML = filtered.map((r, i) => `
    <div class="card" onclick="openPDF(${allRecipes.indexOf(r)})" style="animation-delay:${Math.min(i,20)*0.04}s">
      <span class="cat-tag">${r.icon} ${r.displayName}</span>
      <h3>${r.name}</h3>
      <span class="pdf-icon">📄</span>
    </div>
  `).join('');
}

function filterByCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    const isAll = cat === 'Toutes' && btn.textContent.includes('Toutes');
    const matchCat = cat !== 'Toutes' && categories[cat] && btn.textContent.includes(categories[cat].name);
    btn.classList.toggle('active', isAll || matchCat);
  });
  render();
}

function openPDF(index) {
  const r = allRecipes[index];
  document.getElementById('modal-title').textContent = r.name;
  document.getElementById('pdf-frame').src = r.url;
  document.getElementById('pdf-modal').classList.add('open');
}

document.getElementById('close-modal').onclick = () => {
  document.getElementById('pdf-modal').classList.remove('open');
  document.getElementById('pdf-frame').src = '';
};
document.getElementById('pdf-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('pdf-modal')) {
    document.getElementById('pdf-modal').classList.remove('open');
    document.getElementById('pdf-frame').src = '';
  }
});

document.getElementById('search').addEventListener('input', render);
render();
</script>
