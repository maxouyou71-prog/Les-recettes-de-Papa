<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Recettes de Papa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #fdf6ec; --brown: #5c3d2e; --orange: #e07b39; --light-orange: #f5c18a; }
        body { background: var(--cream); font-family: 'Lato', sans-serif; color: #2a1a0e; margin: 0; }
        header { background: var(--brown); padding: 2rem; text-align: center; color: var(--cream); }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 2.5rem; }
        main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .search-bar { width: 100%; padding: 1rem; border: 2px solid var(--light-orange); border-radius: 50px; margin-bottom: 2rem; font-size: 1rem; outline: none; box-sizing: border-box; }
        .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; justify-content: center; }
        .cat-btn { background: white; border: 2px solid var(--light-orange); border-radius: 50px; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .cat-btn.active { background: var(--orange); color: white; border-color: var(--orange); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: white; border-radius: 15px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; border-left: 5px solid var(--orange); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card h3 { margin: 0.5rem 0; font-size: 1.1rem; color: var(--brown); }
        .card .tag { font-size: 0.75rem; color: var(--orange); font-weight: bold; text-transform: uppercase; }
        #loader { text-align: center; font-style: italic; color: var(--brown); padding: 2rem; }
    </style>
</head>
<body>

<header>
    <h1>👨‍🍳 Les Recettes de Papa 📖</h1>
</header>

<main>
    <input type="text" id="search" class="search-bar" placeholder="Rechercher une recette...">
    <div class="categories" id="category-filters">
        <button class="cat-btn active" onclick="filterByCat('Toutes')">🍽️ Toutes</button>
    </div>
    <div id="loader">Chargement de vos recettes...</div>
    <div class="grid" id="recipe-grid"></div>
</main>

<script>
    const USER = "maxouyou71-prog";
    const REPO = "Les-recettes-de-Papa";
    let allRecipes = [];

    async function init() {
        try {
            // URL stable pour lire vos dossiers 01 à 20
            const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents`);
            if (!response.ok) throw new Error();
            const items = await response.json();
            
            const folders = items.filter(item => item.type === "dir").sort((a, b) => a.name.localeCompare(b.name));
            const filterContainer = document.getElementById('category-filters');
            
            for (const folder of folders) {
                const cleanName = folder.name.replace(/^\d+-\s*/, '');
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerText = cleanName;
                btn.onclick = () => filterByCat(folder.name);
                filterContainer.appendChild(btn);

                const resFiles = await fetch(folder.url);
                const files = await resFiles.json();
                files.forEach(file => {
                    if (file.name.toLowerCase().endsWith('.pdf')) {
                        const pdfUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${encodeURIComponent(folder.name)}/${encodeURIComponent(file.name)}`;
                        allRecipes.push({
                            name: file.name.replace('.pdf', '').replace(/_/g, ' ').replace(/-/g, ' '),
                            category: folder.name,
                            displayName: cleanName,
                            url: pdfUrl
                        });
                    }
                });
            }
            document.getElementById('loader').style.display = 'none';
            render();
        } catch (error) {
            document.getElementById('loader').innerHTML = "❌ Erreur de connexion avec GitHub.";
        }
    }

    function render(filter = "Toutes") {
        const searchTerm = document.getElementById('search').value.toLowerCase();
        const grid = document.getElementById('recipe-grid');
        const filtered = allRecipes.filter(r => {
            const matchCat = (filter === "Toutes" || r.category === filter);
            return matchCat && r.name.toLowerCase().includes(searchTerm);
        });
        grid.innerHTML = filtered.map(r => `
            <div class="card" onclick="window.open('${r.url}', '_blank')">
                <div class="tag">📁 ${r.displayName}</div>
                <h3>${r.name}</h3>
            </div>
        `).join('');
    }

    function filterByCat(cat) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            const btnText = btn.innerText;
            const compareText = cat.replace(/^\d+-\s*/, '');
            btn.classList.toggle('active', (cat === "Toutes" && btnText === "🍽️ Toutes") || compareText === btnText);
        });
        render(cat);
    }
    document.getElementById('search').oninput = () => render();
    init();
</script>
</body>
</html>
